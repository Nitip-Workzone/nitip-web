name: Deploy to VPS (Self-Hosted)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: nitip-prod

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy Secrets File
        run: |
          cp ~/.secret/nitip-web-production.env .env

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Install Dependencies
        run: |
          bun install

      - name: Build Static Site
        run: |
          rm -rf .output .nuxt
          bun run generate

      - name: Stop and Cleanup Docker Web Container
        run: |
          docker compose down || true
          docker image rm nitip-web-app || true

      - name: Deploy Static Files to Nginx Path
        run: |
          rm -rf /var/www/nitip-web/*
          cp -r .output/public/* /var/www/nitip-web/
          ls -lh /var/www/nitip-web/ | head -n 20

      - name: Cleanup
        run: |
          rm -f .env || true
          docker image prune -f
